# Site settings
title: "Dumb Is Okay"
subtitle: "Coming to terms with culture, music, mortality and the human condition."
description: >-
  A personal blog about culture, music, mortality and the human condition. I write about my experiences, thoughts and feelings in an honest and open way.
url: "https://dumbisokay.github.io"
baseurl: ""
locale: "en-US"

# Theme
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "default"

# Build settings
markdown: kramdown
plugins:
  - jekyll-include-cache

# Author
author:
  name: "D"
  bio: ""
  location: "Stuttgart, Germany"

# Site-wide defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Pagination
paginate: 10
paginate_path: /page:num/

include:
  - _pages

# Outputting
permalink: /:categories/:title/
timezone: Europe/Berlin

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - token
